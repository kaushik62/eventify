name: eventify

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build: ./backend
    image: kaushik62/eventify:backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    image: kaushik62/eventify:frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
    env_file:
      - path: .env
        required: false
    depends_on:
      - backend

volumes:
  postgres-data:
